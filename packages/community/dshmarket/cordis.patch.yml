# setup-pnpm,logs,status} via lib/index.js ctx.inject(['webServer']) and the
# browser half sits in lib/client.js (loaded by the modules node half from the
# package.json 'dsh.client' declaration).

- insert:
    - id: dsh-market
      name: '@deepseek-ai/dsh-market'
