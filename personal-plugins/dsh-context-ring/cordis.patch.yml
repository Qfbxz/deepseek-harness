# dsh-context-ring bundle patch. Host half serves /api/context-ring/config
# (loopback, validated, persisted back into this patch file); client half is
# the sidebar 圆环 palette card.
- insert:
    - id: dsh-context-ring
      name: dsh-context-ring
      config:
        warnAt: 50
        dangerAt: 80
        warnColor: '#f59e0b'
        dangerColor: '#ef4444'
