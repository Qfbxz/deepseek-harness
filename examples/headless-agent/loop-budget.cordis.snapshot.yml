# WP1 loop-hygiene replay: the turn tool-call budget event. Includes cordis.yml
# directly (a config patch cannot target an entry behind a nested include) and
# RESTATES the agent-spine row config — a patch replaces the whole config —
# with `maxToolCallsPerTurn: 4` so the assembled turn crosses the budget inside
# one replayed task. The key-requiring DeepSeek adapter is disabled in favor of
# the replay catch-all.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          maxToolCallsPerTurn: 4
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model.

            Verify your work by running the code or tests. Keep answers brief and
            factual.
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
