# WP5 token-counter control: the same scripted conversation and the same
# 0.5 × 19000 = 9500 threshold as token-counter.cordis.snapshot.yml, but the
# adapter leaves `countTokens` undeclared, so the character estimate (~5000)
# prices the threshold and declines to compact.
- id: token-counter-absent-mock-llm
  name: './tests/fixtures/token-counter-absent-mock-llm.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: compaction-basic
        name: '@deepseek-ai/dsh-compaction-basic'
        config:
          thresholdRatio: 0.99
          retainTokens: 20
          maxTokens: 64
