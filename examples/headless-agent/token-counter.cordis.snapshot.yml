# WP5 provider token counter replay: one scripted todo_write step triggers the
# step-pressure check, the routed adapter reports a real tokenizer-style count
# for the full request envelope, and the threshold decision runs on that
# reported count. Includes cordis.yml directly (a config patch cannot target an
# entry behind a nested include), restates the compaction-basic row, and
# disables the key-requiring DeepSeek adapter in favor of the keyless
# counter-mock fixture, which claims the composition's own deepseek-official
# route. The fixture counts at 2 chars/token (near the measured 2.09), so the
# first reported count lands above and the post-compaction count below the
# 0.5 × 20200 = 10100 threshold, while the character estimate (~5300) stays
# below it — only the reported count can trigger this compaction.
- id: token-counter-mock-llm
  name: './tests/fixtures/token-counter-mock-llm.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: compaction-basic
        name: '@deepseek-ai/dsh-compaction-basic'
        config:
          thresholdRatio: 0.5
          retainTokens: 20
          maxTokens: 64
      # RESTATES the agent-spine row config — a patch replaces the whole config —
      # with includeMethodology: false: the threshold choreography is
      # calibrated to this composition's prompt weight, and the methodology
      # section is unrelated weight here.
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          includeMethodology: false
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model.

            Verify your work by running the code or tests. Keep answers brief and
            factual.
