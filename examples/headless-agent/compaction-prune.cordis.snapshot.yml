# Keyless context-overflow composition for the assembled prune snapshot: the
# optional pruner replaces the oversized bash result before summarization.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: compaction-basic
        name: '@deepseek-ai/dsh-compaction-basic'
        config:
          thresholdRatio: 0.99
          retainTokens: 20
          maxTokens: 32
      - insert:
          - id: compaction-tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 2500
              headChars: 400
              tailChars: 100
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
