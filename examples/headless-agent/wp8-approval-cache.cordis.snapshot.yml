# WP8 session approval cache replay: the same todo_write shape asks once and is
# served by the service's session approval cache on the identical second call.
# Includes cordis.yml directly (a config patch cannot target an entry behind a
# nested include), mounts the approval seam plainly, inserts the interaction
# fixture (ask before every todo_write, grant every ask) and the scripted
# keyless adapter, and disables the key-requiring DeepSeek adapter. Two calls,
# one prompt: the second ask never reaches an answerer.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'

- id: wp8-approval-fixture
  name: './tests/fixtures/wp8-approval-fixture-cache.ts'

- id: wp8-cache-mock-llm
  name: './tests/fixtures/wp8-cache-mock-llm.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
