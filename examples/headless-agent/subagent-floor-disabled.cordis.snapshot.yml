# WP2 subagent report floor, DISABLED arm: the fork child again returns a short
# report, but the fork row is restated (a patch replaces the whole config) with
# `floorContinuationAttempts: 0`, so the floor is off and the short report
# reaches the parent unchanged. Includes cordis.yml directly (a config patch
# cannot target an entry behind a nested include) and disables the key-requiring
# DeepSeek adapter in favor of the replay catch-all.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: tool-subagent-fork
        name: '@deepseek-ai/dsh-tool-subagent'
        config:
          provider: fork
          toolName: subagent_fork
          backgroundMode: one-shot
          enableRunInBackground: false
          maxDepth: 1
          floorContinuationAttempts: 0
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
